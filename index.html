<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Segments - Territory Claiming Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            overflow: hidden;
        }

        #gameContainer {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            width: fit-content;
        }

        #gameCanvas {
            border: 3px solid #333;
            display: block;
            background: #000;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        #ui {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            gap: 10px;
            flex-wrap: wrap;
        }

        #controls {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
            max-width: 90%;
        }

        .game-over h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        .game-over button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .game-over button:hover,
        .game-over button:active {
            background: #45a049;
        }

        @media (max-width: 850px) {
            body {
                padding: 5px;
            }

            #gameContainer {
                padding: 10px;
            }

            #ui {
                font-size: 14px;
            }

            #controls {
                font-size: 12px;
            }
        }

        @media (max-width: 600px) {
            #ui {
                font-size: 12px;
            }

            .game-over {
                padding: 20px;
            }

            .game-over h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Territory: <span id="percentage">0</span>%</div>
            <div>Level: <span id="level">1</span></div>
            <div>Lives: <span id="lives">3</span></div>
        </div>
        <div id="controls">
            <span id="controlsText">Use Arrow Keys or WASD to move • Claim 75% to win!</span>
        </div>
    </div>

    <div id="gameOver" class="game-over">
        <h2 id="resultText"></h2>
        <p id="finalStats"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas setup
        function setupCanvas() {
            const maxWidth = Math.min(800, window.innerWidth - 40);
            const maxHeight = Math.min(600, window.innerHeight - 180);
            const aspectRatio = 800 / 600;

            let width, height;
            if (maxWidth / maxHeight > aspectRatio) {
                height = maxHeight;
                width = height * aspectRatio;
            } else {
                width = maxWidth;
                height = width / aspectRatio;
            }

            canvas.width = 800;
            canvas.height = 600;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        setupCanvas();

        // Game constants
        const GRID_SIZE = 800;
        const CELL_SIZE = 4;
        const GRID_COLS = GRID_SIZE / CELL_SIZE;
        const GRID_ROWS = canvas.height / CELL_SIZE;
        const PLAYER_SPEED = 2;

        // Cell states
        const EMPTY = 0;
        const CLAIMED = 1;
        const BORDER = 2;
        const TRAIL = 3;

        // Game state
        let grid = [];
        let player = {
            x: 0,
            y: 0,
            direction: 0, // 0=right, 1=down, 2=left, 3=up
            onBorder: true,
            trail: [],
            moveTimer: 0
        };
        let enemies = [];
        let lives = 3;
        let level = 1;
        let claimedPercentage = 0;
        let keys = {};
        let gameRunning = true;
        let lastMoveTime = 0;
        const MOVE_DELAY = 50; // milliseconds between moves

        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        let touchSwipeDetected = false;

        // Detect if mobile device
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                         ('ontouchstart' in window);

        // Update controls text
        if (isMobile) {
            document.getElementById('controlsText').textContent = 'Swipe to move • Claim 75% to win!';
        }

        // Initialize grid
        function initGrid() {
            grid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(EMPTY));

            // Set borders as claimed territory (safe zones)
            for (let i = 0; i < GRID_COLS; i++) {
                grid[0][i] = BORDER;
                grid[GRID_ROWS - 1][i] = BORDER;
            }
            for (let i = 0; i < GRID_ROWS; i++) {
                grid[i][0] = BORDER;
                grid[i][GRID_COLS - 1] = BORDER;
            }

            // Interior starts as EMPTY (unclaimed territory)
            // Player will claim territory by drawing trails
        }

        // Initialize player
        function initPlayer() {
            player.x = 0;
            player.y = Math.floor(GRID_ROWS / 2);
            player.direction = 0; // facing right
            player.onBorder = true;
            player.trail = [];
            player.moveTimer = 0;
        }

        // Initialize enemies
        function initEnemies() {
            enemies = [];
            for (let i = 0; i < level; i++) {
                enemies.push({
                    x: Math.random() * (GRID_COLS - 4) + 2,
                    y: Math.random() * (GRID_ROWS - 4) + 2,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            }
        }

        // Calculate claimed percentage
        function calculateClaimed() {
            let claimed = 0;
            let total = (GRID_COLS - 2) * (GRID_ROWS - 2);

            for (let y = 1; y < GRID_ROWS - 1; y++) {
                for (let x = 1; x < GRID_COLS - 1; x++) {
                    if (grid[y][x] === CLAIMED || grid[y][x] === BORDER) {
                        claimed++;
                    }
                }
            }

            return Math.round((claimed / total) * 100);
        }

        // Flood fill algorithm to claim territory
        function floodFill(startX, startY, enemyPositions) {
            const filled = new Set();
            const toCheck = [[startX, startY]];
            let hasEnemy = false;

            while (toCheck.length > 0) {
                const [x, y] = toCheck.pop();
                const key = `${x},${y}`;

                if (filled.has(key)) continue;
                if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) continue;
                if (grid[y][x] !== EMPTY) continue;

                // Check if enemy is in this region
                for (const enemy of enemyPositions) {
                    if (Math.floor(enemy.x) === x && Math.floor(enemy.y) === y) {
                        hasEnemy = true;
                    }
                }

                filled.add(key);
                toCheck.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }

            return { filled, hasEnemy };
        }

        // Claim territory
        function claimTerritory() {
            // Mark trail as border
            for (const [x, y] of player.trail) {
                grid[y][x] = BORDER;
            }

            // Find all separate empty regions
            const visited = new Set();
            const regions = [];

            for (let y = 1; y < GRID_ROWS - 1; y++) {
                for (let x = 1; x < GRID_COLS - 1; x++) {
                    const key = `${x},${y}`;
                    if (grid[y][x] === EMPTY && !visited.has(key)) {
                        const result = floodFill(x, y, enemies);
                        result.filled.forEach(k => visited.add(k));
                        regions.push(result);
                    }
                }
            }

            // Claim regions without enemies
            for (const region of regions) {
                if (!region.hasEnemy) {
                    for (const key of region.filled) {
                        const [x, y] = key.split(',').map(Number);
                        grid[y][x] = CLAIMED;
                    }
                }
            }

            player.trail = [];
        }

        // Update player
        function updatePlayer() {
            if (!gameRunning) return;

            const currentTime = Date.now();

            // Determine desired direction from input
            let desiredDirection = player.direction;

            // Keyboard controls - set direction based on key press
            if (keys['ArrowRight'] || keys['d']) desiredDirection = 0; // right
            if (keys['ArrowDown'] || keys['s']) desiredDirection = 1; // down
            if (keys['ArrowLeft'] || keys['a']) desiredDirection = 2; // left
            if (keys['ArrowUp'] || keys['w']) desiredDirection = 3; // up

            // Update direction (instant turn)
            player.direction = desiredDirection;

            // Move at fixed intervals
            if (currentTime - lastMoveTime < MOVE_DELAY) {
                return;
            }
            lastMoveTime = currentTime;

            // Calculate next position based on direction
            let newX = player.x;
            let newY = player.y;

            switch(player.direction) {
                case 0: newX++; break; // right
                case 1: newY++; break; // down
                case 2: newX--; break; // left
                case 3: newY--; break; // up
            }

            // Check bounds
            if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) {
                return; // Can't move outside grid
            }

            const gridX = Math.floor(newX);
            const gridY = Math.floor(newY);
            const currentCell = grid[gridY][gridX];

            // Check if on border or claimed territory
            const wasOnBorder = player.onBorder;
            player.onBorder = (currentCell === BORDER || currentCell === CLAIMED);

            // Moving into empty space - start trail
            if (wasOnBorder && currentCell === EMPTY) {
                player.trail = [[gridX, gridY]];
            }
            // Continuing trail
            else if (!player.onBorder && currentCell === EMPTY) {
                const lastTrail = player.trail[player.trail.length - 1];
                if (!lastTrail || lastTrail[0] !== gridX || lastTrail[1] !== gridY) {
                    player.trail.push([gridX, gridY]);
                }
            }
            // Returned to safe zone - claim territory
            else if (!wasOnBorder && player.onBorder && player.trail.length > 0) {
                claimTerritory();
            }

            player.x = newX;
            player.y = newY;
        }

        // Update enemies
        function updateEnemies() {
            for (const enemy of enemies) {
                enemy.x += enemy.vx * 0.1;
                enemy.y += enemy.vy * 0.1;

                const gridX = Math.floor(enemy.x);
                const gridY = Math.floor(enemy.y);

                // Bounce off walls and claimed territory
                if (gridX <= 1 || gridX >= GRID_COLS - 2 ||
                    grid[gridY][gridX] === BORDER || grid[gridY][gridX] === CLAIMED) {
                    enemy.vx *= -1;
                }
                if (gridY <= 1 || gridY >= GRID_ROWS - 2 ||
                    grid[gridY][gridX] === BORDER || grid[gridY][gridX] === CLAIMED) {
                    enemy.vy *= -1;
                }

                // Keep in bounds
                enemy.x = Math.max(2, Math.min(GRID_COLS - 3, enemy.x));
                enemy.y = Math.max(2, Math.min(GRID_ROWS - 3, enemy.y));

                // Check collision with player trail
                for (const [tx, ty] of player.trail) {
                    if (Math.abs(enemy.x - tx) < 1 && Math.abs(enemy.y - ty) < 1) {
                        loseLife();
                        return;
                    }
                }

                // Check collision with player
                if (Math.abs(enemy.x - player.x) < 1 && Math.abs(enemy.y - player.y) < 1 && !player.onBorder) {
                    loseLife();
                    return;
                }
            }
        }

        // Lose a life
        function loseLife() {
            lives--;
            document.getElementById('lives').textContent = lives;

            if (lives <= 0) {
                gameOver(false);
            } else {
                initPlayer();
            }
        }

        // Game over
        function gameOver(won) {
            gameRunning = false;
            const overlay = document.getElementById('gameOver');
            const resultText = document.getElementById('resultText');
            const finalStats = document.getElementById('finalStats');

            if (won) {
                resultText.textContent = '🎉 Victory!';
                resultText.style.color = '#4CAF50';
                finalStats.textContent = `You completed Level ${level} with ${lives} lives remaining!`;
            } else {
                resultText.textContent = '💀 Game Over';
                resultText.style.color = '#f44336';
                finalStats.textContent = `You reached ${claimedPercentage}% territory on Level ${level}`;
            }

            overlay.style.display = 'block';
        }

        // Render
        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            for (let y = 0; y < GRID_ROWS; y++) {
                for (let x = 0; x < GRID_COLS; x++) {
                    const cell = grid[y][x];

                    if (cell === CLAIMED) {
                        ctx.fillStyle = '#2196F3';
                    } else if (cell === BORDER) {
                        ctx.fillStyle = '#00BCD4';
                    } else {
                        continue;
                    }

                    ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            // Draw trail
            ctx.fillStyle = '#FFEB3B';
            for (const [x, y] of player.trail) {
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }

            // Draw player
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(
                player.x * CELL_SIZE - CELL_SIZE,
                player.y * CELL_SIZE - CELL_SIZE,
                CELL_SIZE * 2,
                CELL_SIZE * 2
            );

            // Draw enemies
            ctx.fillStyle = '#F44336';
            for (const enemy of enemies) {
                ctx.beginPath();
                ctx.arc(
                    enemy.x * CELL_SIZE,
                    enemy.y * CELL_SIZE,
                    CELL_SIZE * 1.5,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            // Update UI
            claimedPercentage = calculateClaimed();
            document.getElementById('percentage').textContent = claimedPercentage;
            document.getElementById('level').textContent = level;

            // Check win condition
            if (claimedPercentage >= 75 && gameRunning) {
                level++;
                if (level > 10) {
                    gameOver(true);
                } else {
                    initGrid();
                    initPlayer();
                    initEnemies();
                }
            }
        }

        // Game loop
        function gameLoop() {
            updatePlayer();
            updateEnemies();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Input handling - Keyboard
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Input handling - Touch
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = touch.clientX - rect.left;
            touchStartY = touch.clientY - rect.top;
            touchSwipeDetected = false;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (touchSwipeDetected) return;

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchCurrentX = touch.clientX - rect.left;
            const touchCurrentY = touch.clientY - rect.top;

            const deltaX = touchCurrentX - touchStartX;
            const deltaY = touchCurrentY - touchStartY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            // Detect swipe direction when threshold is reached
            if (distance > 30) {
                touchSwipeDetected = true;

                // Determine primary direction (horizontal or vertical)
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // Horizontal swipe
                    player.direction = deltaX > 0 ? 0 : 2; // right : left
                } else {
                    // Vertical swipe
                    player.direction = deltaY > 0 ? 1 : 3; // down : up
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchSwipeDetected = false;
        }, { passive: false });

        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            touchSwipeDetected = false;
        }, { passive: false });

        // Handle window resize
        window.addEventListener('resize', () => {
            setupCanvas();
        });

        // Initialize and start game
        initGrid();
        initPlayer();
        initEnemies();
        gameLoop();
    </script>
</body>
</html>
